problem:
  x_min: -1.0
  x_max: 1.0
  t_max: 1.0
  nx: 2048
  nt: 201
  nu_list: [0.0318309886, 0.00318309886, 0.000318309886]   # 0.1/pi, 0.01/pi, 0.001/pi
seed: 0
split:
  scheme: interleaved       # train = even-index snapshots, test = odd-index
reference:
  dz: 0.05                  # step of the scaled Hopf-Cole quadrature variable z (integrand width is >= ~0.3)
  log_cutoff: 50.0          # drop quadrature tail where the integrand is below exp(-log_cutoff) of its peak
resolution:
  min_points_across_shock: 5
pod:
  tolerances: [0.01, 0.001] # relative reconstruction error targets
  energy_ranks: [5, 10, 20] # ranks at which captured energy is compared across nu (prediction P2)
spectrum:
  times: [0.2, 0.5, 1.0]    # before shock time, near, after
  fit_k_range: [10, 100]    # wavenumber window for the slope fit; justify in DECISIONS.md
  floor: 1.0e-12            # amplitudes below floor * max amplitude are round-off and excluded from the fit
output:
  root: results
